title: Startseite
hide: true
tabs:
  main:
    display: Inhalt
    sections:
      -
        display: Kopfbereich
        instructions: 'Das Erste, was Besucher sehen.'
        fields:
          -
            handle: eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              instructions: 'Wird in Großbuchstaben gesetzt.'
              character_limit: 40
          -
            handle: heading
            field:
              type: text
              display: Überschrift
              instructions: 'Der größte Satz der Seite. Zwei Zeilen wirken am besten.'
              character_limit: 60
              validate:
                - required
          -
            handle: text
            field:
              type: textarea
              display: Einleitung
              instructions: 'Ein bis zwei Sätze.'
              character_limit: 160
          -
            handle: callout
            field:
              type: text
              display: Hinweis neben dem Button
              instructions: 'Zum Beispiel die Gottesdienstzeit. Leer lassen, wenn nicht nötig.'
              character_limit: 40
          -
            import: buttons
          -
            handle: image
            field:
              type: assets
              display: Bild
              instructions: 'Steht breit unter dem Text. Quer aufgenommen.'
              container: assets
              max_files: 1
      -
        display: 'Einstieg & Gottesdienst'
        instructions: 'Links der Text, rechts die festen Zeiten.'
        fields:
          -
            handle: service_eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              character_limit: 30
          -
            handle: service_heading
            field:
              type: text
              display: Überschrift
              character_limit: 60
          -
            handle: service_text
            field:
              type: textarea
              display: Text
              character_limit: 300
          -
            handle: service_buttons
            field:
              type: grid
              display: Buttons
              instructions: 'Höchstens zwei. Der erste wird hervorgehoben.'
              mode: stacked
              add_row: 'Button hinzufügen'
              max_rows: 2
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Beschriftung
                    character_limit: 30
                    validate:
                      - required
                    width: 50
                -
                  handle: link
                  field:
                    type: link
                    display: Ziel
                    validate:
                      - required
                    width: 50
          -
            handle: service_facts
            field:
              type: grid
              display: Feste Zeiten
              instructions: 'Zwei bis drei. Stehen rechts neben dem Text.'
              mode: stacked
              add_row: 'Zeit hinzufügen'
              max_rows: 3
              fields:
                -
                  handle: marker
                  field:
                    type: text
                    display: Kürzel
                    instructions: 'Kurz — „SO“, „24/7“.'
                    character_limit: 6
                    validate:
                      - required
                    width: 25
                -
                  handle: label
                  field:
                    type: text
                    display: Kurze Zeile darüber
                    character_limit: 25
                    width: 35
                -
                  handle: title
                  field:
                    type: text
                    display: Bezeichnung
                    character_limit: 30
                    validate:
                      - required
                    width: 40
      -
        display: Demnächst
        instructions: 'Die nächsten Veranstaltungen.'
        fields:
          -
            handle: events_eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              character_limit: 30
          -
            handle: events_heading
            field:
              type: text
              display: Überschrift
              character_limit: 60
          -
            handle: events
            field:
              type: grid
              display: Veranstaltungen
              instructions: 'Werden durchnummeriert, in dieser Reihenfolge.'
              mode: stacked
              add_row: 'Veranstaltung hinzufügen'
              max_rows: 8
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Art
                    instructions: 'Zum Beispiel „Gottesdienst“.'
                    character_limit: 30
                    width: 33
                -
                  handle: title
                  field:
                    type: text
                    display: Titel
                    character_limit: 70
                    validate:
                      - required
                    width: 67
                -
                  handle: link_label
                  field:
                    type: text
                    display: 'Beschriftung des Links'
                    instructions: 'Leer lassen, wenn es keine Unterseite gibt.'
                    character_limit: 25
                    width: 33
                -
                  handle: link
                  field:
                    type: link
                    display: Ziel
                    width: 67
      -
        display: 'Regelmäßige Termine'
        instructions: 'Was jede Woche stattfindet.'
        fields:
          -
            handle: recurring_eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              character_limit: 30
          -
            handle: recurring_heading
            field:
              type: text
              display: Überschrift
              character_limit: 60
          -
            handle: recurring
            field:
              type: grid
              display: Termine
              instructions: 'Drei nebeneinander wirken am besten.'
              mode: stacked
              add_row: 'Termin hinzufügen'
              max_rows: 6
              fields:
                -
                  handle: day
                  field:
                    type: text
                    display: Wochentag
                    instructions: 'Zwei Buchstaben — „SO“, „MI“, „SA“.'
                    character_limit: 3
                    validate:
                      - required
                    width: 25
                -
                  handle: label
                  field:
                    type: text
                    display: Häufigkeit
                    character_limit: 20
                    width: 25
                -
                  handle: title
                  field:
                    type: text
                    display: Bezeichnung
                    character_limit: 30
                    validate:
                      - required
                    width: 50
                -
                  handle: text
                  field:
                    type: text
                    display: Eine Zeile dazu
                    character_limit: 55
      -
        display: Angebote
        instructions: 'Auf dunklem Grund. Links die Überschrift, rechts die Liste.'
        fields:
          -
            handle: offers_eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              character_limit: 30
          -
            handle: offers_heading
            field:
              type: text
              display: Überschrift
              instructions: 'Steht in einer schmalen Spalte, bricht also früh um.'
              character_limit: 45
          -
            handle: offers
            field:
              type: grid
              display: Angebote
              instructions: 'Werden durchnummeriert, in dieser Reihenfolge.'
              mode: stacked
              add_row: 'Angebot hinzufügen'
              max_rows: 8
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: 'Für wen'
                    character_limit: 30
                    width: 33
                -
                  handle: title
                  field:
                    type: text
                    display: Titel
                    character_limit: 45
                    validate:
                      - required
                    width: 67
                -
                  handle: text
                  field:
                    type: text
                    display: Eine Zeile dazu
                    character_limit: 90
      -
        display: Team
        instructions: 'Die Menschen der Gemeinde.'
        fields:
          -
            handle: team_eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              character_limit: 30
          -
            handle: team_heading
            field:
              type: text
              display: Überschrift
              character_limit: 60
          -
            handle: team_lead
            field:
              type: textarea
              display: 'Großer Satz'
              instructions: 'Steht links, in der Schrift der Überschriften.'
              character_limit: 200
          -
            handle: team_text
            field:
              type: textarea
              display: 'Text daneben'
              character_limit: 300
          -
            handle: team
            field:
              type: grid
              display: Personen
              instructions: 'Die ersten beiden stehen groß, alle weiteren kleiner darunter.'
              mode: stacked
              add_row: 'Person hinzufügen'
              fields:
                -
                  handle: image
                  field:
                    type: assets
                    display: Foto
                    instructions: 'Quer aufgenommen.'
                    container: assets
                    max_files: 1
                    validate:
                      - required
                -
                  handle: name
                  field:
                    type: text
                    display: Name
                    character_limit: 40
                    validate:
                      - required
                    width: 50
                -
                  handle: role
                  field:
                    type: text
                    display: Aufgabe
                    character_limit: 45
                    width: 50
      -
        display: Einblicke
        instructions: 'Zwei Kacheln, die auf Unterseiten führen.'
        fields:
          -
            handle: insights
            field:
              type: grid
              display: Kacheln
              instructions: 'Genau zwei. Die zweite wird dunkel gesetzt.'
              mode: stacked
              add_row: 'Kachel hinzufügen'
              max_rows: 2
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Kurze Zeile darüber
                    character_limit: 25
                    width: 33
                -
                  handle: title
                  field:
                    type: text
                    display: Überschrift
                    character_limit: 30
                    validate:
                      - required
                    width: 67
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                    character_limit: 140
                -
                  handle: link_label
                  field:
                    type: text
                    display: 'Beschriftung des Links'
                    character_limit: 25
                    width: 33
                -
                  handle: link
                  field:
                    type: link
                    display: Ziel
                    width: 67
      -
        display: Spenden
        instructions: 'Der farbige Aufruf am Ende.'
        fields:
          -
            handle: donation_eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              character_limit: 30
          -
            handle: donation_heading
            field:
              type: text
              display: Überschrift
              instructions: 'Steht in einer schmalen Spalte, bricht also früh um.'
              character_limit: 40
          -
            handle: donation_text
            field:
              type: textarea
              display: Text
              character_limit: 200
          -
            handle: donation_buttons
            field:
              type: grid
              display: Buttons
              instructions: 'Höchstens zwei. Der erste wird hervorgehoben.'
              mode: stacked
              add_row: 'Button hinzufügen'
              max_rows: 2
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Beschriftung
                    character_limit: 30
                    validate:
                      - required
                    width: 50
                -
                  handle: link
                  field:
                    type: link
                    display: Ziel
                    validate:
                      - required
                    width: 50
      -
        display: Besuch
        instructions: 'Adresse und Kontakt, mit einem Bild daneben.'
        fields:
          -
            handle: visit_eyebrow
            field:
              type: text
              display: Kurze Zeile darüber
              character_limit: 40
          -
            handle: visit_heading
            field:
              type: text
              display: Überschrift
              character_limit: 50
          -
            handle: visit_organisation
            field:
              type: text
              display: Name der Gemeinde
              character_limit: 40
          -
            handle: visit_address
            field:
              type: textarea
              display: Adresse und Kontakt
              instructions: 'Eine Angabe pro Zeile.'
              character_limit: 160
          -
            handle: visit_buttons
            field:
              type: grid
              display: Buttons
              instructions: 'Höchstens zwei. Der erste wird hervorgehoben.'
              mode: stacked
              add_row: 'Button hinzufügen'
              max_rows: 2
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Beschriftung
                    character_limit: 30
                    validate:
                      - required
                    width: 50
                -
                  handle: link
                  field:
                    type: link
                    display: Ziel
                    validate:
                      - required
                    width: 50
          -
            handle: visit_social
            field:
              type: text
              display: Zeile unter den Buttons
              instructions: 'Zum Beispiel ein Hinweis auf Instagram.'
              character_limit: 45
          -
            handle: visit_image
            field:
              type: assets
              display: Bild
              instructions: 'Steht hochformatig rechts daneben.'
              container: assets
              max_files: 1
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_description
            field:
              type: textarea
              display: Suchmaschinen-Beschreibung
              instructions: 'Der Text unter dem Titel in den Suchergebnissen. Leer gelassen, greift der Fallback aus Globals → SEO.'
              character_limit: 160
          -
            handle: og_image
            field:
              type: assets
              display: Teilen-Bild
              instructions: 'Wird angezeigt, wenn ein Link zu dieser Seite geteilt wird. Leer gelassen, greift der Fallback aus Globals → SEO.'
              container: assets
              max_files: 1
          -
            handle: noindex
            field:
              type: toggle
              display: 'Von Suchmaschinen ausschließen'
              instructions: 'Die Seite bleibt erreichbar, taucht aber nicht in Suchergebnissen auf.'
              default: false
  settings:
    display: Einstellungen
    sections:
      -
        fields:
          -
            handle: template
            field:
              type: template
              display: Template
              instructions: 'Nur ändern, wenn für diese Seite ein eigenes Template gebaut wurde.'
              hide_partials: true
